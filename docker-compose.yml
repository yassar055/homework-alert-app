version: '3.8'

services:
  homework-alert:
    build: .
    container_name: homework-alert
    ports:
      - "8080:8080"
    volumes:
      # Persist H2 database across container restarts
      - homework-data:/app/data
    environment:
      - SERVER_PORT=8080
      # Uncomment and set to enable Google Sheets auto-sync:
      # - GOOGLE_SHEETS_WEBHOOK_URL=https://script.google.com/macros/s/YOUR_ID/exec
    restart: unless-stopped

volumes:
  homework-data:
