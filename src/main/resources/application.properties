# Server
server.port=8080

# H2 Database (for users & notifications only - homework lives in Google Sheets)
spring.datasource.url=jdbc:h2:file:./data/homework-alert
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf
spring.thymeleaf.cache=false

# Google Sheets Configuration
# Set these to connect to Google Sheets (app works in demo mode without them)
google.sheets.id=
google.sheets.credentials-file=credentials.json
